<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Accessible Photo Gallery</title>
    <link rel="stylesheet" href="css/gallery.css">
    <script src="js/gallery.js"></script>
</head>

<body onload="loadEvent()">
    <div id="image">
        Hover over an image below to display here.
    </div>

    <img class="preview" alt="Aerial City View" src="https://i.ibb.co/FLRnQjrq/Aerial-view.jpg" 
    onmouseover="upDate(this)" onmouseout="unDo()"
    onfocus="upDate(this)" onblur="unDo()">

    <img class="preview" alt="Crossing the Bridge" src="https://i.ibb.co/ycGDdwWZ/Crossing.jpg" 
    onmouseover="upDate(this)" onmouseout="unDo()"
    onfocus="upDate(this)" onblur="unDo()">

    <img class="preview" alt="Under the Shade of a Big Tree" src="https://i.ibb.co/wZM8FyNC/Under-the-shade.jpg" 
    onmouseover="upDate(this)" onmouseout="unDo()"
    onfocus="upDate(this)" onblur="unDo()">

    <img class="preview" alt="Warm Stairwell" src="https://i.ibb.co/dwkbwwXP/Warm-stairwell.jpg" 
    onmouseover="upDate(this)" onmouseout="unDo()"
    onfocus="upDate(this)" onblur="unDo()">

    <img class="preview" alt="Food for Thought" src="https://i.ibb.co/BppjZHX/Food-for-thought.jpg" 
    onmouseover="upDate(this)" onmouseout="unDo()"
    onfocus="upDate(this)" onblur="unDo()">
    
    <img class="preview" alt="After the Rain Pours" src="https://i.ibb.co/XkKFdKdq/After-the-rain-pours.jpg" 
    onmouseover="upDate(this)" onmouseout="unDo()"
    onfocus="upDate(this)" onblur="unDo()">

</body>
</html>
